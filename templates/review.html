<!DOCTYPE html>
<html>
<head>
    <title>Code Review</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

    <h1>AI Code Reviewer</h1>

    <form method="POST">

        <textarea
            name="code"
            placeholder="Paste your code here..."
            rows="15"></textarea>

        <br><br>

        <button type="submit">
            Analyze Code
        </button>

    </form>

    {% if result %}
    <div class="result">
        <h3>Analysis Result</h3>
        <p>{{ result|safe }}</p>
    </div>
    {% endif %}

</div>

</body>
</html>
